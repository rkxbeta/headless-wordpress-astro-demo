<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Accent glow orb -->
  <circle cx="950" cy="200" r="280" fill="#f97316" opacity="0.12" filter="blur(60px)" />
  <circle cx="200" cy="500" r="220" fill="#f97316" opacity="0.08" filter="blur(60px)" />

  <!-- Outer frame border -->
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Publication masthead pill -->
  <g transform="translate(80, 85)">
    <rect width="210" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#f97316" />
    <text x="32" y="22" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">THE HEADLESS JOURNAL</text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(80, 140)">
    <rect width="150" height="28" rx="4" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4" stroke-width="1" />
    <text x="75" y="18" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">ASTRO ENGINE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Astro Islands &amp; Zero-JS Core</text>
  <text x="80" y="285" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Partial Hydration &amp; Sub-100ms TTFB</text>

  <!-- Center Visual Card / Code Badge -->
  <g transform="translate(80, 360)">
    <rect width="1040" height="190" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Code header dots -->
    <circle cx="24" cy="24" r="5" fill="#ef4444" opacity="0.7" />
    <circle cx="40" cy="24" r="5" fill="#f59e0b" opacity="0.7" />
    <circle cx="56" cy="24" r="5" fill="#10b981" opacity="0.7" />
    
    <text x="80" y="28" fill="#64748b" font-family="ui-monospace, monospace" font-size="12">system-pipeline.ts</text>
    <line x1="0" y1="44" x2="1040" y2="44" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Code / Architecture Symbol text -->
    <text x="40" y="115" fill="#f97316" font-family="ui-monospace, monospace" font-size="26" font-weight="600" letter-spacing="0.5">ISLANDS // ZERO RUNTIME JS</text>
    <text x="40" y="150" fill="#64748b" font-family="ui-monospace, monospace" font-size="14">// Powered by RKX API Studio • High-Performance Astro Frontend</text>
  </g>
</svg>